name: PayPhone reconciliation

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payphone-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reconcile durable PayPhone notifications
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not configured" >&2
            exit 1
          fi

          curl --fail --show-error --silent \
            --retry 2 \
            --retry-all-errors \
            --max-time 45 \
            --header "Authorization: Bearer $CRON_SECRET" \
            https://pescaconfe.com/api/cron/payphone-reconciliar
